name: Refresquito - Build Keycloak SSO image

# Deliberately scoped to ONLY this branch. Never touches the upstream
# activepieces/activepieces tags, DockerHub, or the depot-based release
# workflows — this publishes solely to this fork's own GHCR namespace.
on:
  push:
    branches:
      - refresquito-keycloak-sso
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/javivillar/activepieces:refresquito-keycloak-sso
            ghcr.io/javivillar/activepieces:refresquito-keycloak-sso-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
